# Every push and pull request: the shared Kotlin logic, the Android app and the iPhone app must build and pass their
# tests. The iPhone app is only built here (macOS runner with Xcode): no signing, no upload.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared tests (JVM), Android tests, debug APK
        run: |
          chmod +x gradlew
          ./gradlew :shared:jvmTest :app:testDebugUnitTest :app:assembleDebug --console=plain

  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared tests on the iOS simulator (Kotlin/Native)
        run: |
          chmod +x gradlew
          ./gradlew :shared:iosSimulatorArm64Test --console=plain
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Build the iPhone app for the simulator
        run: |
          set +e
          xcodebuild -project ios/PoiCapture.xcodeproj -scheme PoiCapture -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO build > xcodebuild.log 2>&1
          status=$?
          # every compiler error / warning of our code, then the end of the log
          grep -E ":[0-9]+:[0-9]+: (error|warning):" xcodebuild.log | sort -u | head -n 150
          tail -n 25 xcodebuild.log
          exit $status
      - name: Keep the Xcode log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
