# Signed APK for every version tag. Bump versionCode / versionName in app/build.gradle.kts, commit, then
#   git tag v0.8.0 && git push origin v0.8.0
# GitHub runs the unit tests, builds app-release.apk, signs it with the release key kept in the repository secrets
# (RELEASE_KEYSTORE_B64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS) and attaches poi-capture-vX.Y.Z.apk to the
# release vX.Y.Z, with quet-pho-vX.Y.Z.aab (the same key, for the Play Console: there it is the upload key).
# Download: https://github.com/<owner>/<repo>/releases/latest
# An older tag without the .aab: Actions -> release -> Run workflow (from this branch), tag vX.Y.Z.
# Release notes: release-notes/vi/X.Y.Z.txt (committed before the tag, <= 500 characters, release-notes/README.md)
# become play-notes-vX.Y.Z.txt on the release, "<vi>...</vi>" ready to paste into the Play Console.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build again, e.g. v0.8.0"
        required: true

permissions:
  contents: write              # create the release, upload the APK

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: The tag must match versionName
        run: |
          V=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "v$V" != "$TAG" ]; then echo "::error::tag $TAG does not match versionName $V"; exit 1; fi

      - name: Release notes (Play Console, Vietnamese)
        run: |
          V="${TAG#v}"
          NOTES="release-notes/vi/$V.txt"
          if [ ! -f "$NOTES" ]; then echo "::error::$NOTES is missing: write the release notes before tagging (release-notes/README.md)"; exit 1; fi
          python3 - "$NOTES" "play-notes-$TAG.txt" <<'PY'
          import sys
          text = open(sys.argv[1], encoding='utf-8').read().strip()
          if not text:
              sys.exit(f'::error::{sys.argv[1]} is empty')
          if len(text) > 500:
              sys.exit(f'::error::{sys.argv[1]} has {len(text)} characters, the Play Console takes at most 500')
          open(sys.argv[2], 'w', encoding='utf-8').write(f'<vi>\n{text}\n</vi>\n')
          print(f'{len(text)} characters')
          PY
          cat "play-notes-$TAG.txt"

      - name: Release key
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::secret RELEASE_KEYSTORE_B64 is missing"; exit 1; fi
          # tolerate a CR / newline added when the secret was set from a Windows shell
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:assembleRelease :app:bundleRelease

      - name: Check the signature
        env:
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK"
          cp "$APK" "poi-capture-$TAG.apk"
          sha256sum "poi-capture-$TAG.apk" > "poi-capture-$TAG.apk.sha256"
          AAB=app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$AAB" > /dev/null || { echo "::error::the .aab signature does not verify"; exit 1; }
          # the .aab must carry the same certificate as the APK (and as RELEASE_CERT_SHA256, when that variable is set)
          APK_SHA=$("$BT/apksigner" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          AAB_SHA=$(keytool -printcert -jarfile "$AAB" | sed -n 's/.*SHA256: //p' | head -1 | tr -d ': ' | tr 'A-F' 'a-f')
          echo "certificate SHA-256: apk $APK_SHA, aab $AAB_SHA"
          if [ -z "$APK_SHA" ] || [ "$APK_SHA" != "$AAB_SHA" ]; then echo "::error::the .aab and the APK are not signed with the same certificate"; exit 1; fi
          PIN=$(printf '%s' "$RELEASE_CERT_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')
          if [ -n "$PIN" ] && [ "$PIN" != "$APK_SHA" ]; then echo "::error::the release certificate is not the pinned one"; exit 1; fi
          cp "$AAB" "quet-pho-$TAG.aab"
          sha256sum "quet-pho-$TAG.aab" > "quet-pho-$TAG.aab.sha256"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish
        run: |
          FILES="poi-capture-$TAG.apk poi-capture-$TAG.apk.sha256 quet-pho-$TAG.aab quet-pho-$TAG.aab.sha256 play-notes-$TAG.txt"
          { echo "Release notes for the Play Console (also play-notes-$TAG.txt):"; echo; echo '```'; cat "play-notes-$TAG.txt"; echo '```'; } > body.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
            gh release edit "$TAG" --notes-file body.md
          else
            gh release create "$TAG" $FILES --verify-tag --title "Quét Phố $TAG" --notes-file body.md --generate-notes
          fi
          gh release view "$TAG" --json assets -q '.assets[] | "\(.name) \(.size)"'
